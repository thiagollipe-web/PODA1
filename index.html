<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fafafa">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>PODA — Labirinto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fafafa;color:#111;font-family:Arial,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:100%;height:100%;max-width:900px;display:flex;flex-direction:column;padding:8px;gap:6px}.hud{height:42px;display:flex;align-items:center;border-bottom:2px solid #111}.hud h1{margin:0;font-size:22px;letter-spacing:5px}.stats{margin-left:auto;display:flex;gap:14px}.stats div{text-align:right}.stats small{display:block;font-size:8px;color:#666}.stats b{font-size:13px}.stage{position:relative;flex:1;min-height:0;border:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{width:auto;height:auto;max-width:100%;max-height:100%;image-rendering:pixelated}.controls{position:absolute;left:10px;bottom:10px;display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;z-index:5}.controls button{width:50px;height:50px;border:2px solid #111;background:#fff;font-size:22px;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .p{grid-column:2;grid-row:2;background:#111;color:#fff;font-size:14px}.controls .right{grid-column:3;grid-row:2}.controls .down{grid-column:2;grid-row:3}.actions{position:absolute;right:10px;bottom:10px;display:flex;gap:5px}.actions button,.primary{border:2px solid #111;background:#111;color:#fff;padding:10px 14px;font-weight:bold}.overlay{position:absolute;inset:0;background:rgba(250,250,250,.97);z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.card{max-width:430px}.card h2{font-size:26px;letter-spacing:3px}.card p{color:#555}.primary{min-width:180px;font-size:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.options button{padding:15px;border:2px solid #111;background:#fff;font-size:16px;font-weight:bold}.danger{color:#c00!important}@media(max-width:560px){#app{padding:5px}.hud h1{font-size:17px}.stats{gap:7px}.stats b{font-size:11px}.controls{transform:scale(.9);transform-origin:bottom left}}
</style>
</head>
<body>
<div id="app">
<header class="hud"><h1>PODA</h1><div class="stats"><div><small>FASE</small><b id="level">1</b></div><div><small>TEMPO</small><b id="time">40</b></div><div><small>ORBES</small><b id="orbs">0/3</b></div><div><small>PONTOS</small><b id="score">0</b></div></div></header>
<div class="stage" id="stage"><canvas id="game" width="480" height="352"></canvas>
<div class="controls"><button class="up" data-dx="0" data-dy="-1">▲</button><button class="left" data-dx="-1" data-dy="0">◀</button><button class="p" id="bomb">P</button><button class="right" data-dx="1" data-dy="0">▶</button><button class="down" data-dx="0" data-dy="1">▼</button></div>
<div class="actions"><button id="pause">II</button><button id="restart">↻</button></div>
<div class="overlay show" id="start"><div class="card"><h1>PODA</h1><p>Corra pelo labirinto, colete os orbes e desarme a bomba.</p><p>Use o D-Pad, deslize o dedo ou as setas do teclado.</p><button class="primary" id="startBtn">INICIAR</button></div></div>
<div class="overlay" id="puzzle"><div class="card"><p id="category">ENIGMA</p><h2 id="question">?</h2><div class="options" id="options"></div></div></div>
<div class="overlay" id="win"><div class="card"><h2>FASE CONCLUÍDA</h2><p>Você desarmou a bomba.</p><p>Pontos: <b id="winScore">0</b></p><button class="primary" id="next">PRÓXIMA FASE</button></div></div>
<div class="overlay" id="lose"><div class="card"><h2>BOOM</h2><p id="loseText">Tempo esgotado.</p><button class="primary" id="retry">TENTAR NOVAMENTE</button></div></div>
</div></div>
<script>
'use strict';
const COLS=15,ROWS=11,TILE=32,START={x:1,y:1},EXIT={x:13,y:9},TOTAL=1000;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const state={level:1,score:0,maze:null,robot:{x:1,y:1},orbs:[],time:40,status:'idle'};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function maze(seed){const r=rng(seed),m=Array.from({length:ROWS},()=>Array(COLS).fill(1)),seen=new Set();function carve(x,y){m[y][x]=0;seen.add(x+','+y);for(const[dX,dY]of shuffle([[2,0],[-2,0],[0,2],[0,-2]],r)){let nx=x+dX,ny=y+dY;if(nx<=0||ny<=0||nx>=COLS-1||ny>=ROWS-1||seen.has(nx+','+ny))continue;m[y+dY/2][x+dX/2]=0;carve(nx,ny)}}carve(1,1);return m}
function reachable(){const q=[{x:1,y:1}],seen=new Set(['1,1']);for(let i=0;i<q.length;i++){let c=q[i];for(const[dX,dY]of[[1,0],[-1,0],[0,1],[0,-1]]){let x=c.x+dX,y=c.y+dY,k=x+','+y;if(x<0||y<0||x>=COLS||y>=ROWS||state.maze[y][x]||seen.has(k))continue;seen.add(k);q.push({x,y})}}return q}
function dist(a,b){const q=[{x:a.x,y:a.y,d:0}],seen=new Set([a.x+','+a.y]);for(let i=0;i<q.length;i++){let c=q[i];if(c.x===b.x&&c.y===b.y)return c.d;for(const[dX,dY]of[[1,0],[-1,0],[0,1],[0,-1]]){let x=c.x+dX,y=c.y+dY,k=x+','+y;if(x<0||y<0||x>=COLS||y>=ROWS||state.maze[y][x]||seen.has(k))continue;seen.add(k);q.push({x,y,d:c.d+1})}}return 9999}
function load(n){state.level=n;state.maze=maze(n*2654435761+17);state.robot={x:1,y:1};state.time=40+Math.min(30,Math.floor(n/30));state.status='idle';let r=rng(n*1013+7),cells=reachable().filter(c=>!(c.x===1&&c.y===1)&&!(c.x===13&&c.y===9)&&dist(c,EXIT)<9999&&dist({x:1,y:1},c)>2);cells=shuffle(cells,r).sort((a,b)=>dist({x:1,y:1},a)-dist({x:1,y:1},b));const count=Math.min(5,3+Math.floor(n/100));state.orbs=cells.slice(0,count).map(c=>({...c,collected:false}));update()}
function wall(x,y){return x<0||y<0||x>=COLS||y>=ROWS||state.maze[y][x]===1}
function move(dx,dy){if(state.status!=='playing')return;let x=state.robot.x+dx,y=state.robot.y+dy;if(wall(x,y))return;state.robot={x,y};state.score++;for(const o of state.orbs)if(!o.collected&&o.x===x&&o.y===y){o.collected=true;state.time=Math.min(state.time+5,90);state.score+=10}update()}
function interact(){if(state.status==='playing'&&state.robot.x===EXIT.x&&state.robot.y===EXIT.y)openPuzzle()}
function puzzleData(){let r=rng(state.level*7919+13),a=2+Math.floor(r()*12),b=2+Math.floor(r()*12),ans=a+b;return{q:a+' + '+b+' = ?',a:ans,opts:[ans,ans+2,Math.max(1,ans-3),ans+5].sort(()=>r()-.5)}}
function openPuzzle(){state.status='puzzle';let p=puzzleData();$('question').textContent=p.q;$('category').textContent='MATEMÁTICA';$('options').innerHTML='';p.opts.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v,p.a);$('options').appendChild(b)});hide();$('puzzle').classList.add('show')}
function answer(v,a){if(state.status!=='puzzle')return;if(v===a){state.score+=100+Math.floor(state.time*5);state.status='win';$('winScore').textContent=state.score;hide();$('win').classList.add('show')}else{state.status='lose';$('loseText').textContent='Resposta incorreta. A resposta era '+a+'.';hide();$('lose').classList.add('show')}}
function hide(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'))}
function update(){$('level').textContent=state.level;$('time').textContent=Math.max(0,Math.ceil(state.time));$('orbs').textContent=state.orbs.filter(o=>o.collected).length+'/'+state.orbs.length;$('score').textContent=state.score;$('time').classList.toggle('danger',state.time<=10&&state.status==='playing')}
function draw(){ctx.fillStyle='#fafafa';ctx.fillRect(0,0,480,352);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(state.maze[y][x]){ctx.fillStyle='#111';ctx.fillRect(x*TILE,y*TILE,TILE,TILE);ctx.fillStyle='#444';for(let i=0;i<6;i++){ctx.fillRect(x*TILE+i*6,y*TILE,2,TILE)}}let ex=EXIT.x*TILE+16,ey=EXIT.y*TILE+16;ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,11,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();for(const o of state.orbs)if(!o.collected){let x=o.x*TILE+16,y=o.y*TILE+16;ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}let x=state.robot.x*TILE+16,y=state.robot.y*TILE+16;ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.fillRect(x-11,y-9,22,18);ctx.strokeRect(x-11,y-9,22,18);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-5,y-2,2.5,0,Math.PI*2);ctx.arc(x+5,y-2,2.5,0,Math.PI*2);ctx.fill()}
function frame(t){if(state.status==='playing'){if(!state.last)state.last=t;let dt=(t-state.last)/1000;state.last=t;state.time-=dt;if(state.time<=0){state.time=0;state.status='lose';$('loseText').textContent='O tempo acabou.';hide();$('lose').classList.add('show')}}else state.last=t;draw();update();requestAnimationFrame(frame)}
$('startBtn').onclick=()=>{hide();state.status='playing';state.last=performance.now()};$('bomb').onclick=interact;$('pause').onclick=()=>{if(state.status==='playing'){state.status='paused';$('pause').textContent='▶'}else if(state.status==='paused'){state.status='playing';state.last=performance.now();$('pause').textContent='II'}};$('restart').onclick=()=>{load(state.level);state.status='playing';state.last=performance.now()};$('retry').onclick=()=>{load(state.level);state.status='playing';state.last=performance.now()};$('next').onclick=()=>{if(state.level<TOTAL){load(state.level+1);state.status='playing';state.last=performance.now()}else{load(1);state.score=0;state.status='playing';state.last=performance.now()}};
document.querySelectorAll('.controls button[data-dx]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(+b.dataset.dx,+b.dataset.dy)}));
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-1);else if(e.key==='ArrowDown'||e.key==='s')move(0,1);else if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);else if(e.key==='ArrowRight'||e.key==='d')move(1,0);else if(e.key==='p'||e.key==='P')interact();else if(e.key==='Escape'&&state.status==='playing'){$('pause').click()}});
let sx=0,sy=0;const stage=$('stage');stage.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!sx&&!sy)return;let x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;sx=sy=0;if(Math.max(Math.abs(x),Math.abs(y))<20)return;if(Math.abs(x)>Math.abs(y))move(x>0?1:-1,0);else move(0,y>0?1:-1)},{passive:true});
load(1);requestAnimationFrame(frame);
</script>
</body></html>
